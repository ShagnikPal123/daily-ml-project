[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dsl"
version = "0.1.0"
description = "Datasheet spec extraction and retrieval lab (pyramid-structured)"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "scikit-learn", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
dsl = "dsl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
