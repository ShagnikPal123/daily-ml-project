name: datasheet-lab-ci
on:
  push:
    paths: ["datasheet-spec-extraction-rag-lab/**"]
  pull_request:
    paths: ["datasheet-spec-extraction-rag-lab/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: datasheet-spec-extraction-rag-lab
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest -q
      - run: dsl run --quick --out /tmp/quick-results
